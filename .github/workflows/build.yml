name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project dir
        run: |
          if [ -f 4g-omar-project.zip ]; then unzip -oq 4g-omar-project.zip; echo "DIR=4g-omar" >> $GITHUB_ENV; else echo "DIR=." >> $GITHUB_ENV; fi
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.5
      - name: Build debug APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 4G-OMAR-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
